# NVIDIA A100 80GB 物理规格 Deployment + Service 示例
# 由 K8sResourceBuilder.buildVllmDeploymentAndService() 生成
# 适用场景：物理机 / 无 HAMi 切分 / 整卡调度

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3
  namespace: ws-ai-demo-ab12cd34
  labels:
    app: vllm
    spec: a100-80g-physical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm
      deployment: vllm-qwen3
  template:
    metadata:
      labels:
        app: vllm
        deployment: vllm-qwen3
        spec: a100-80g-physical
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_MODEL
              value: /models
          resources:
            limits:
              nvidia.com/gpu: "1"       # 整卡
              cpu: "4"
              memory: 16Gi
              platform.io/a100-80g-physical: "1"  # ResourceQuota 计量键
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
              platform.io/a100-80g-physical: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3-svc
  namespace: ws-ai-demo-ab12cd34
spec:
  type: ClusterIP
  selector:
    app: vllm
    deployment: vllm-qwen3
  ports:
    - port: 8000
      targetPort: 8000
      name: http