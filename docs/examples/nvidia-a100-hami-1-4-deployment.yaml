# NVIDIA A100 80GB HAMi 1/4 卡切分 Deployment + Service 示例
# 由 K8sResourceBuilder.buildVllmDeploymentAndService() 生成
# 适用场景：HAMi 启用，A100 被切成 1/4 卡（20GB, 25% 算力）
# nodeSelector.pool 必须与节点标签 pool=nvidia-a100-80g-1/4 完全匹配

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3
  namespace: ws-ai-demo-ab12cd34
  labels:
    app: vllm
    spec: nvidia-a100-80g-1/4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm
      deployment: vllm-qwen3
  template:
    metadata:
      labels:
        app: vllm
        deployment: vllm-qwen3
        spec: nvidia-a100-80g-1/4
    spec:
      nodeSelector:
        pool: nvidia-a100-80g-1/4    # ← 关键：必须与节点标签一致
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_MODEL
              value: /models
          resources:
            limits:
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: 20480Mi    # HAMi 分配 20GB vGPU
              nvidia.com/gpucores: 25       # HAMi 分配 25% 算力
              cpu: "4"
              memory: 16Gi
              platform.io/nvidia-a100-80g-1/4: "1"  # ResourceQuota 计量
            requests:
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: 20480Mi
              nvidia.com/gpucores: 25
              cpu: "4"
              memory: 16Gi
              platform.io/nvidia-a100-80g-1/4: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3-svc
  namespace: ws-ai-demo-ab12cd34
spec:
  type: ClusterIP
  selector:
    app: vllm
    deployment: vllm-qwen3
  ports:
    - port: 8000
      targetPort: 8000
      name: http