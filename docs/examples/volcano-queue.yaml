# Volcano Queue 示例（集群级资源）
# 由 K8sResourceBuilder.buildVolcanoQueue() 生成
# 队列能力（capability）中放置平台计量键，而非真实 GPU 数量
# 注意：Queue 是集群级资源，不是 namespace 级资源

apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: queue-ws-ai-demo-ab12cd34-cluster-xxx
spec:
  capability:
    platform.io/nvidia-a100-80g-1/4: "20"   # 配额数（与 ResourceQuota max 对应）
  weight: 1
  reclaimable: true