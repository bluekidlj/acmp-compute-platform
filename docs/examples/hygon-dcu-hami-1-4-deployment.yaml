# Hygon DCU 32GB HAMi 1/4 卡切分 Deployment + Service 示例
# 由 K8sResourceBuilder.buildVllmDeploymentAndService() 生成
# 适用场景：HAMi 启用，DCU 被切成 1/4 卡（8GB, 25% 算力）
# 注意：DCU 使用 amd.com/dcu 而非 nvidia.com/gpu

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3
  namespace: ws-ai-demo-ab12cd34
  labels:
    app: vllm
    spec: hygon-dcu-32g-1/4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm
      deployment: vllm-qwen3
  template:
    metadata:
      labels:
        app: vllm
        deployment: vllm-qwen3
        spec: hygon-dcu-32g-1/4
    spec:
      nodeSelector:
        pool: hygon-dcu-32g-1/4    # ← 关键：必须与节点标签一致
      tolerations:
        - key: amd.com/dcu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_MODEL
              value: /models
          resources:
            limits:
              amd.com/dcu: "1"           # DCU 使用 amd.com/dcu 而非 nvidia.com/gpu
              cpu: "4"
              memory: 16Gi
              platform.io/hygon-dcu-32g-1/4: "1"  # ResourceQuota 计量
            requests:
              amd.com/dcu: "1"
              cpu: "4"
              memory: 16Gi
              platform.io/hygon-dcu-32g-1/4: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3-svc
  namespace: ws-ai-demo-ab12cd34
spec:
  type: ClusterIP
  selector:
    app: vllm
    deployment: vllm-qwen3
  ports:
    - port: 8000
      targetPort: 8000
      name: http