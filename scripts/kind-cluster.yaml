# ACMP-Compute 1.0 测试用 kind 集群配置
# - 1 control-plane 节点
# - 关闭默认端口映射（避免与本地 8080 等冲突）
# - 为后续 NVIDIA device plugin DaemonSet 留 extraMounts
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: acmp-test
nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings: []
    extraMounts:
      # 预留：可挂载假 GPU device 文件以触发 device plugin 发现
      - hostPath: /dev/null
        containerPath: /dev/null
        readOnly: true
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
  disableDefaultCNI: false
  kubeProxyMode: iptables
featureGates:
  # 关闭双栈减少干扰
  IPv6DualStack: false
